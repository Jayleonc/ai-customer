server:
  port: "8080"
  mode: "debug"

log:
  level: "info"
  format: "json"

database:
  # 必填，本地开发时先改这里
  dsn: "host=127.0.0.1 user=root password=jayleonc dbname=ai_customer port=15432 sslmode=disable"

# 企微平台配置
wecom:
  # 必填
  api_host: "https://s2.xunjinet.com.cn"
  app_key: "${WECOM_APP_KEY}"
  app_secret: "${WECOM_APP_SECRET}"
  callback:
    token: "${WECOM_CALLBACK_TOKEN}"
    aes_key: "${WECOM_CALLBACK_AES_KEY}"

# knowledge-hub 配置
knowledge_hub:
  # 必填
  host: "http://localhost:9090"
  api_key: "${KH_API_KEY}"
  timeout: 30  # seconds

# AI Agent 配置
# base_url / api_key / model 必填
agent:
  base_url: "https://api.openai.com/v1"
  api_key: "${OPENAI_API_KEY}"
  model: "gpt-4o-mini"
  temperature: 0.3
  history_limit: 20
  reply_max_length: 0                  # 最终回复硬上限；0 表示不硬截断，只在 prompt 中要求简洁

  # 图片理解配置（客户发图片/截图时，先观察成客服可读上下文，再进入同一个 RAG agent）
  image_understanding_mode: "observe"  # observe / disabled
  vision_provider: "openai"
  vision_base_url: ""                  # 空则复用 agent.base_url
  vision_api_key: ""                   # 空则复用 agent.api_key
  vision_model: ""                     # 空则复用 agent.model；建议使用支持视觉的模型
  vision_detail: "low"                 # low / high / auto，按 provider 支持情况传递
  vision_timeout_seconds: 60
  vision_image_max_bytes: 5242880      # 5MB，超过直接拒绝观察，避免上下文和 API 成本失控

  # 检索工具输出配置（search_knowledge / read_document）
  retrieval_max_evidence: 8            # search_knowledge 最大证据数
  retrieval_evidence_max_chars: 0      # 单条证据最大字数；0 表示不做单条硬截断
  retrieval_context_budget: 6000       # search_knowledge 工具输出总字数预算
  read_document_max_chars: 10000       # read_document 工具最大返回字数

  # Runtime 配置（turnmesh 负责主 turn/tool loop）
  token_budget: 10000                  # 单次 LLM 调用最大输入 token 数，超限自动裁剪历史
  tool_timeout_seconds: 60             # 工具调用超时秒数，超时返回错误消息继续回答
